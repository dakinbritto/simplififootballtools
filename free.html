                <button class="carousel-btn carousel-prev absolute left-4 top-1/2 transform -translate-y-1/2 bg-black/50 backdrop-blur-sm hover:bg-black/70 text-white p-3 rounded-full transition-all duration-300 z-10">

            <!-- LOGIN -->
            <div class="flex justify-center">
                <div class="login-card">

                    <form id="loginForm">
                        <div style="margin-bottom:16px;">
                            <label class="field-label" for="email">Email</label>
                            <input id="email" type="email" required autocomplete="email" class="field-input" placeholder="your@email.com">
                        </div>
                        <div>
                            <label class="field-label" for="password">Password</label>
                            <input id="password" type="password" required autocomplete="current-password" class="field-input" placeholder="••••••••">
                        </div>
                        <button type="submit" id="loginBtn" class="bg-gradient-to-r from-orange-500 to-orange-600 hover:from-orange-600 hover:to-orange-700 text-white px-6 py-3 rounded-full font-bold text-base transition-all duration-300 w-full mt-6">
                            GET ACCESS
                        </button>
                    </form>

        </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC2ILk_So6nzqGuZifYfTEktwZUqwu0TdM",
            authDomain: "simplififootball-1234.firebaseapp.com",
            projectId: "simplififootball-1234",
            storageBucket: "simplififootball-1234.firebasestorage.app",
            messagingSenderId: "953983072540",
            appId: "1:953983072540:web:2e8d75afa04dd84a6762d9",
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const fbAuth = firebase.auth();
        const REDIRECT_URL = "/planyourbet.html";

        const form = document.getElementById('loginForm');
        const btn = document.getElementById('loginBtn');
        const msg = document.getElementById('msg');

        function showMsg(text, type) {
            msg.textContent = text;
            msg.className = 'msg ' + type;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            btn.disabled = true;
            btn.textContent = 'SIGNING IN...';
            msg.className = 'msg';

            try {
                await fbAuth.signInWithEmailAndPassword(email, password);
                showMsg('Access granted. Redirecting...', 'success');
                setTimeout(() => { window.location.href = REDIRECT_URL; }, 700);
            } catch (err) {
                let text = 'Login failed. Check your details and try again.';
                if (err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password' || err.code === 'auth/user-not-found') {
                    text = 'Incorrect email or password.';
                } else if (err.code === 'auth/too-many-requests') {
                    text = 'Too many attempts. Try again shortly.';
                }
                showMsg(text, 'error');
                btn.disabled = false;
                btn.textContent = 'GET ACCESS';
            }
        });

        fbAuth.onAuthStateChanged((user) => {
            if (user) window.location.href = REDIRECT_URL;
        });

        function initCarousel() {
            const track = document.getElementById('carouselTrack');
            const prevBtn = document.querySelector('.carousel-prev');
            const nextBtn = document.querySelector('.carousel-next');
            const dots = document.querySelectorAll('.carousel-dot');
            let currentSlide = 0;
            const totalSlides = 8;

            let autoSlide = setInterval(() => {
                currentSlide = (currentSlide + 1) % totalSlides;
                updateCarousel();
            }, 5000);

            function updateCarousel() {
                const offset = currentSlide * -100;
                track.style.transform = `translateX(${offset}%)`;
                dots.forEach((dot, index) => {
                    if (index === currentSlide) {
                        dot.classList.remove('bg-white/30');
                        dot.classList.add('bg-orange-400');
                    } else {
                        dot.classList.remove('bg-orange-400');
                        dot.classList.add('bg-white/30');
                    }
                });
            }

            if (prevBtn && nextBtn) {
                prevBtn.addEventListener('click', () => {
                    clearInterval(autoSlide);
                    currentSlide = (currentSlide - 1 + totalSlides) % totalSlides;
                    updateCarousel();
                    autoSlide = setInterval(() => {
                        currentSlide = (currentSlide + 1) % totalSlides;
                        updateCarousel();
                    }, 5000);
                });
                nextBtn.addEventListener('click', () => {
                    clearInterval(autoSlide);
                    currentSlide = (currentSlide + 1) % totalSlides;
                    updateCarousel();
                    autoSlide = setInterval(() => {
                        currentSlide = (currentSlide + 1) % totalSlides;
                        updateCarousel();
                    }, 5000);
                });
            }

            dots.forEach((dot, index) => {
                dot.addEventListener('click', () => {
                    clearInterval(autoSlide);
                    currentSlide = index;
                    updateCarousel();
                    autoSlide = setInterval(() => {
                        currentSlide = (currentSlide + 1) % totalSlides;
                        updateCarousel();
                    }, 5000);
                });
            });

            updateCarousel();

            const carousel = document.querySelector('.carousel-wrapper');
            if (carousel) {
                carousel.addEventListener('mouseenter', () => clearInterval(autoSlide));
                carousel.addEventListener('mouseleave', () => {
                    autoSlide = setInterval(() => {
                        currentSlide = (currentSlide + 1) % totalSlides;
                        updateCarousel();
                    }, 5000);
                });
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            initCarousel();
        });
    </script>
